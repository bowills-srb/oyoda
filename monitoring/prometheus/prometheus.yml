global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/concierge_alert_rules.yml

scrape_configs:
  - job_name: concierge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: pgbouncer
    static_configs:
      - targets: ["pgbouncer-exporter:9127"]
