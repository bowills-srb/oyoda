<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Emerald Shores Stays — Operator Console (Demo)</title>
<style>
  :root{
    --bg:#0f1620; --panel:#16202c; --panel2:#1c2836; --line:#283545;
    --text:#e7eef6; --muted:#8aa0b4; --accent:#3b82f6;
    --text-ch:#10b981; --email-ch:#8b5cf6; --high:#ef4444;
    --in:#22303f; --out:#1d4ed8;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text)}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#16212e,#121a24)}
  header .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#10b981,#3b82f6);
       display:flex;align-items:center;justify-content:center;font-weight:700;color:#04121f}
  header h1{font-size:16px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:12px}
  .chips{margin-left:auto;display:flex;gap:8px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--text);font-size:13px}
  .chip.high b{color:var(--high)}
  .wrap{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 63px)}
  .list{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  .tabs{display:flex;gap:6px;padding:12px;position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);z-index:2}
  .tab{flex:1;text-align:center;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;
       color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:600}
  .tab.active{background:var(--panel2);color:var(--text);border-color:#3a4a5c}
  .tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .conv{padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:5px}
  .conv:hover{background:var(--panel2)}
  .conv.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
  .conv .row1{display:flex;align-items:center;gap:8px}
  .conv .guest{font-weight:650}
  .conv .time{margin-left:auto;color:var(--muted);font-size:11px}
  .conv .prop{color:var(--muted);font-size:12px}
  .conv .prev{color:#b9c8d6;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:700;letter-spacing:.02em}
  .b-text{background:rgba(16,185,129,.16);color:#34d399;border:1px solid rgba(16,185,129,.35)}
  .b-email{background:rgba(139,92,246,.16);color:#a78bfa;border:1px solid rgba(139,92,246,.35)}
  .b-stage{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .b-high{background:rgba(239,68,68,.16);color:#f87171;border:1px solid rgba(239,68,68,.4)}
  .pane{display:flex;flex-direction:column;height:100%}
  .pane .top{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .pane .top h2{margin:0 0 3px;font-size:15px}
  .pane .top .meta{color:var(--muted);font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .thread{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
  .msg{max-width:74%;padding:10px 13px;border-radius:13px;font-size:13.5px;position:relative}
  .msg .who{font-size:10.5px;color:var(--muted);margin-bottom:3px}
  .msg.inbound{align-self:flex-start;background:var(--in);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.outbound{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}
  .msg.draft{align-self:flex-end;background:transparent;border:1px dashed #5b6b7d;color:#cdd9e5}
  .msg.draft .who{color:#f0b429}
  .draft-actions{display:flex;gap:8px;margin-top:8px}
  .draft-actions button{font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);
       background:var(--panel2);color:var(--text);cursor:pointer}
  .draft-actions .approve{background:var(--text-ch);color:#04121f;border:none;font-weight:700}
  .composer{border-top:1px solid var(--line);padding:12px 16px;background:var(--panel)}
  .composer .ctoggle{display:flex;gap:6px;margin-bottom:9px;align-items:center}
  .composer .ctoggle span{color:var(--muted);font-size:12px;margin-right:4px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{padding:6px 12px;background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
  .seg button.on{color:#04121f}
  .seg button.on.text{background:var(--text-ch)}
  .seg button.on.email{background:var(--email-ch);color:#fff}
  .composer .box{display:flex;gap:10px}
  .composer textarea{flex:1;resize:none;height:44px;background:var(--bg);border:1px solid var(--line);border-radius:9px;
       color:var(--text);padding:10px;font:inherit}
  .composer .send{padding:0 18px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  .empty{margin:auto;color:var(--muted);text-align:center}
  .hint{color:var(--muted);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="logo">ES</div>
  <div>
    <h1 id="company">Operator Console</h1>
    <div class="sub">Unified guest messaging · Text &amp; Email · <span style="color:#f0b429">DEMO</span></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div class="wrap">
  <div class="list">
    <div class="tabs">
      <button class="tab active" data-ch="all">All</button>
      <button class="tab" data-ch="text"><span class="dot" style="background:var(--text-ch)"></span>Text</button>
      <button class="tab" data-ch="email"><span class="dot" style="background:var(--email-ch)"></span>Email</button>
    </div>
    <div id="convlist"></div>
  </div>
  <div class="pane" id="pane">
    <div class="empty">Select a conversation</div>
  </div>
</div>
<script>
const DATA = __DEMO_DATA__;
let filter = "all", selId = null;

const esc = s => (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const fmt = iso => { if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return "";
  const now=new Date(); const sameDay=d.toDateString()===now.toDateString();
  return sameDay ? d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})
                 : d.toLocaleDateString([], {month:"short",day:"numeric"}); };
const chBadge = c => c==="email" ? '<span class="badge b-email">✉ Email</span>'
                                 : '<span class="badge b-text">💬 Text</span>';

function renderChips(){
  const s = DATA.stats;
  document.getElementById("company").textContent = DATA.company;
  document.getElementById("chips").innerHTML =
    `<div class="chip">Open <b>${s.total}</b></div>`+
    `<div class="chip"><span class="badge b-text">💬</span> Text <b>${s.text}</b></div>`+
    `<div class="chip"><span class="badge b-email">✉</span> Email <b>${s.email}</b></div>`+
    `<div class="chip high">Escalations <b>${s.escalations}</b></div>`;
}
function renderList(){
  const items = DATA.conversations.filter(c=>filter==="all"||c.channel===filter);
  document.getElementById("convlist").innerHTML = items.map(c=>`
    <div class="conv ${c.id===selId?'sel':''}" data-id="${c.id}">
      <div class="row1">
        ${chBadge(c.channel)}
        <span class="guest">${esc(c.guest)}</span>
        ${c.escalated?'<span class="badge b-high">⚠ HIGH</span>':''}
        <span class="time">${fmt(c.last_at)}</span>
      </div>
      <div class="prop">${esc(c.property)} · <span class="badge b-stage">${esc(c.stage_label)}</span></div>
      <div class="prev">${esc(c.last_preview)}</div>
    </div>`).join("") || `<div class="empty" style="padding:30px">No ${filter} conversations</div>`;
  document.querySelectorAll(".conv").forEach(el=>el.onclick=()=>{selId=el.dataset.id;renderList();renderPane();});
}
function renderPane(){
  const c = DATA.conversations.find(x=>x.id===selId);
  const pane = document.getElementById("pane");
  if(!c){ pane.innerHTML='<div class="empty">Select a conversation</div>'; return; }
  const msgs = c.messages.map(m=>{
    if(m.kind==="draft") return `
      <div class="msg draft">
        <div class="who">🤖 AI draft · pending review</div>${esc(m.text)}
        <div class="draft-actions">
          <button class="approve" data-approve="1">Approve &amp; send</button>
          <button>Edit</button>
        </div>
      </div>`;
    return `<div class="msg ${m.dir}"><div class="who">${m.dir==='inbound'?esc(c.guest):'Operator / AI'} · ${fmt(m.at)}</div>${esc(m.text)}</div>`;
  }).join("");
  pane.innerHTML = `
    <div class="top">
      <h2>${esc(c.guest)} ${chBadge(c.channel)} ${c.escalated?'<span class="badge b-high">⚠ HIGH PRIORITY</span>':''}</h2>
      <div class="meta"><span>${esc(c.property)}</span><span class="badge b-stage">${esc(c.stage_label)}</span>
           <span>·</span><span>${esc(c.status_label)}</span>${c.dates?'<span>· '+esc(c.dates)+'</span>':''}</div>
    </div>
    <div class="thread" id="thread">${msgs}</div>
    <div class="composer">
      <div class="ctoggle"><span>Reply via</span>
        <div class="seg">
          <button class="text ${c.channel==='text'?'on':''}" data-mode="text">💬 Text</button>
          <button class="email ${c.channel==='email'?'on':''}" data-mode="email">✉ Email</button>
        </div>
      </div>
      <div class="box"><textarea id="reply" placeholder="Type a reply…"></textarea>
        <button class="send" id="send">Send</button></div>
      <div class="hint">Sending is simulated in this demo (no real SMS/email is dispatched).</div>
    </div>`;
  let mode = c.channel;
  pane.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    mode=b.dataset.mode; pane.querySelectorAll(".seg button").forEach(x=>x.classList.remove("on")); b.classList.add("on");});
  const append = (text)=>{
    c.messages.push({dir:"outbound",text,at:new Date().toISOString(),kind:"message"});
    c.last_preview=text; c.last_at=new Date().toISOString(); renderPane(); renderList();
    const t=document.getElementById("thread"); if(t) t.scrollTop=t.scrollHeight;
  };
  document.getElementById("send").onclick=()=>{const v=document.getElementById("reply").value.trim();if(v)append(v);};
  pane.querySelectorAll("[data-approve]").forEach(b=>b.onclick=()=>{
    const d=c.messages.find(m=>m.kind==="draft"); if(d){d.kind="message";d.dir="outbound";d.at=new Date().toISOString();}
    renderPane(); renderList();});
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  filter=t.dataset.ch; document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); renderList();});
renderChips(); renderList();
if(DATA.conversations[0]){ selId=DATA.conversations[0].id; renderList(); renderPane(); }
</script>
</body>
</html>
