# Alembic configuration file

[alembic]
script_location = db/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
timezone = UTC

# Truncate long revision hash in file names
truncate_slug_length = 40

# Set to 'true' to run autogenerate after every revision
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without source
sourceless = false

# Version table name
version_table = alembic_version

# Version table schema
version_table_schema =

# Where to start when using revision ranges
output_encoding = utf-8

# Connection URL - override with env var
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Disabled — black formatter not needed at runtime


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
